name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: GrimProg-design

          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=7c3aed&color_dots=0d1117,1a1b27
            dist/github-snake-dark.svg?palette=github-dark&color_snake=a855f7&color_dots=0f0c29,302b63

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
